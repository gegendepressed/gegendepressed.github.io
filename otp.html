<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTP Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #040814;
      color: #f6f7fb;
      font-family: 'Raleway', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .otp-container {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 24px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: 0.02em;
    }
    .otp-input {
      width: 100%;
      background: rgba(14, 23, 49, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.35em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .otp-input:focus {
      border-color: #4f80ff;
      box-shadow: 0 0 16px rgba(79, 128, 255, 0.4);
    }
    .btn-submit {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #4f80ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #3b6ae8;
    }
  </style>
</head>
<body>
  <div class="otp-container">
    <h1>Enter OTP</h1>
    <form action="#" method="post" onsubmit="event.preventDefault();">
      <input 
        type="text" 
        name="otp" 
        id="otp" 
        autocomplete="one-time-code" 
        inputmode="numeric" 
        pattern="[0-9]*" 
        maxlength="6" 
        placeholder="······" 
        class="otp-input"
        autofocus 
      />
      <button type="submit" class="btn-submit">Submit</button>
    </form>
  </div>
</body>
</html>
